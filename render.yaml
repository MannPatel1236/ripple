services:
  # 1. Backend Web Service (FastAPI)
  - type: web
    name: ripple-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.api:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true

  # 2. Frontend Static Site
  - type: web
    name: ripple-frontend
    runtime: static
    buildCommand: ""
    staticPublishPath: frontend
    plan: free
    autoDeploy: true
